workflow:
  attrs:
    realtime: false
    scheduler: slurm
    cyclethrottle: 24
    taskthrottle: 24
  cycledef:
    - attrs:
        group: cycled
      spec: {{ DATE_FIRST_CYCLE }}00 {{ DATE_LAST_CYCLE }}00 {{ DATE_CYCLE_FREQ_HR }}:00:00
    - attrs:
        group: first_cycle
      spec: {{ DATE_FIRST_CYCLE }}00 {{ DATE_FIRST_CYCLE }}00 {{ DATE_CYCLE_FREQ_HR }}:00:00
{%- if date_second_cycle is not none %}
    - attrs:
        group: cycled_from_second
      spec: {{ date_second_cycle }}00 {{ DATE_LAST_CYCLE }}00 {{ DATE_CYCLE_FREQ_HR }}:00:00
{%- endif %}
  entities:
    ACCOUNT: "{{ ACCOUNT }}"
    ALLCOMP_RESTART_N: "{{ ALLCOMP_RESTART_N }}"
    APP: "{{ APP }}"
    ATM_IO_LAYOUT_X: "{{ ATM_IO_LAYOUT_X }}"
    ATM_IO_LAYOUT_Y: "{{ ATM_IO_LAYOUT_Y }}"
    ATM_LAYOUT_X: "{{ ATM_LAYOUT_X }}"
    ATM_LAYOUT_Y: "{{ ATM_LAYOUT_Y }}"
    atm_model: "{{ atm_model }}"
    CCPP_SUITE: "{{ CCPP_SUITE }}"
    COLDSTART: "{{ COLDSTART }}"
    COMINgdas: "{{ COMINgdas }}"
    COMINgfs: "{{ COMINgfs }}"
    CUSTOM_JEDI_CONFIG_FLAG: "{{ CUSTOM_JEDI_CONFIG_FLAG }}"
    CUSTOM_JEDI_CONFIG_PATH: "{{ CUSTOM_JEDI_CONFIG_PATH }}"
    CUSTOM_JEDI_CONFIG_PREFIX: "{{ CUSTOM_JEDI_CONFIG_PREFIX }}"
    DATE_CYCLE_FREQ_HR: "{{ DATE_CYCLE_FREQ_HR }}"
    DATE_FIRST_CYCLE: "{{ DATE_FIRST_CYCLE }}"
    DATE_LAST_CYCLE: "{{ DATE_LAST_CYCLE }}"
    DATM_DATA_TYPE: "{{ DATM_DATA_TYPE }}"
    datm_nx_global: "{{ datm_nx_global }}"
    datm_ny_global: "{{ datm_ny_global }}"
    DCOMINghcn: "{{ DCOMINghcn }}"
    DCOMINobs: "{{ DCOMINobs }}"
    DCOMINsmap: "{{ DCOMINsmap }}"
    DCOMINsmops: "{{ DCOMINsmops }}"
    DO_FREE_FORECAST: "{{ DO_FREE_FORECAST }}"
    DT_ATMOS: "{{ DT_ATMOS }}"
    DT_MOM6: "{{ DT_MOM6 }}"
    DT_RUNSEQ: "{{ DT_RUNSEQ }}"
    envir: "{{ envir }}"
    exp_basedir: "{{ exp_basedir }}"
    exp_case_path: "{{ exp_case_path }}"
    FCST_HRS: "{{ FCST_HRS }}"
    FHROT: "{{ FHROT }}"
    FRAC_GRID: "{{ FRAC_GRID }}"
    IC_DATA_MODEL: "{{ IC_DATA_MODEL }}"
    IC_FROM_FIX_DIR: "{{ IC_FROM_FIX_DIR }}"
    ice_model: "{{ ice_model }}"
    JEDI_ALGORITHM: "{{ JEDI_ALGORITHM }}"
    JEDI_BIN_PATH: "{{ JEDI_BIN_PATH }}"
    JEDI_IODACONV_PATH: "{{ JEDI_IODACONV_PATH }}"
    JEDI_TYPE_SNOW: "{{ JEDI_TYPE_SNOW }}"
    JEDI_TYPE_SOCA: "{{ JEDI_TYPE_SOCA }}"
    JEDI_TYPE_SOIL_MOISTURE: "{{ JEDI_TYPE_SOIL_MOISTURE }}"
    KEEPDATA: "{{ KEEPDATA }}"
    list_jedi_land: "{{ list_jedi_land }}"
    MACHINE: "{{ MACHINE }}"
    model_ver: "{{ model_ver }}"
    MOM6_DT_THERM: "{{ MOM6_DT_THERM }}"
    MOM6_NIGLOBAL: "{{ MOM6_NIGLOBAL }}"
    MOM6_NJGLOBAL: "{{ MOM6_NJGLOBAL }}"
    MOM6_NK: "{{ MOM6_NK }}"
    native_default: "{{ native_default }}"
    NET: "{{ NET }}"
    NPROCS_ANALYSIS: "{{ NPROCS_ANALYSIS }}"
    NPROCS_FCST_IC: "{{ NPROCS_FCST_IC }}"
    NPROCS_ICE: "{{ NPROCS_ICE }}"
    NPROCS_OCN: "{{ NPROCS_OCN }}"
    NPROCS_WAV: "{{ NPROCS_WAV }}"
    NPZ: "{{ NPZ }}"
    nnodes_forecast: "{{ nnodes_forecast }}"
    nprocs_forecast: "{{ nprocs_forecast }}"
    nprocs_forecast_atm: "{{ nprocs_forecast_atm }}"
    nprocs_forecast_med: "{{ nprocs_forecast_med }}"
    nprocs_per_node: "{{ nprocs_per_node }}"
    OBS_GHCN_SNOW: "{{ OBS_GHCN_SNOW }}"
    OBS_IMS_SNOW: "{{ OBS_IMS_SNOW }}"
    OBS_SFCSNO: "{{ OBS_SFCSNO }}"
    OBS_SMAP: "{{ OBS_SMAP }}"
    OBS_SMOPS: "{{ OBS_SMOPS }}"
    OCN_MESH_FN: "{{ OCN_MESH_FN }}"
    ocn_model: "{{ ocn_model }}"
    OUTPUT_FH: "{{ OUTPUT_FH }}"
    OUTPUT_FH_CICE: "{{ OUTPUT_FH_CICE }}"
    OUTPUT_FH_MOM6: "{{ OUTPUT_FH_MOM6 }}"
    OUTPUT_FH_WW3: "{{ OUTPUT_FH_WW3 }}"
    partition_default: "{{ partition_default }}"
    PTMP: "{{ PTMP }}"
    PY_LOG_LEVEL: "{{ PY_LOG_LEVEL }}"
    queue_default: "{{ queue_default }}"
    RES: "{{ RES }}"
    RESTART_INTERVAL: "{{ RESTART_INTERVAL }}"
    RUN: "{{ RUN }}"
    res_p1: "{{ res_p1 }}"
    SCHED: "slurm"
    SMAP_RAW_WINDOW_SPAN_HALF: "{{ SMAP_RAW_WINDOW_SPAN_HALF }}"
    WARMSTART_DIR: "{{ WARMSTART_DIR }}"
    wav_model: "{{ wav_model }}"
    WRITE_GROUPS: "{{ WRITE_GROUPS }}"
    WRITE_TASKS_PER_GROUP: "{{ WRITE_TASKS_PER_GROUP }}"
    HOMEufsda: "&exp_basedir;/ufs-da-workflow"
    COMROOT: "&PTMP;/&envir;/com"
    DATAROOT: "&PTMP;/&envir;/tmp"
    LOGDIR: "&COMROOT;/output/logs"
    LOGFN_SUFFIX: "<cyclestr>_@Y@m@d@H.log</cyclestr>"
    PDY:  "<cyclestr>@Y@m@d</cyclestr>"
    cyc: "<cyclestr>@H</cyclestr>"
    DATADEP_COLDSTART: "<cyclestr>&exp_case_path;/task_skip_coldstart_@Y@m@d@H.txt</cyclestr>"
    DATADEP_SFC1: "<cyclestr>&DATAROOT;/DATA_SHARE/RESTART/@Y@m@d.@H0000.sfc_data.tile6.nc</cyclestr>" 
    DATADEP_SFC2: "<cyclestr>&WARMSTART_DIR;/@Y@m@d.@H0000.sfc_data.tile6.nc</cyclestr>"
    DATADEP_MOM1: "<cyclestr>&DATAROOT;/DATA_SHARE/RESTART/@Y@m@d.@H0000.MOM.res.nc</cyclestr>"
    DATADEP_MOM2: "<cyclestr>&WARMSTART_DIR;/@Y@m@d.@H0000.MOM.res.nc</cyclestr>"
  log:
    value: "&LOGDIR;/workflow.log"
  tasks:
{%- if DO_FREE_FORECAST != "ctest" %}
    task_prep_data:
      attrs:
        cycledefs: cycled
        maxtries: 2
      envars:
        ACCOUNT: "&ACCOUNT;"
        ALLCOMP_RESTART_N: "&ALLCOMP_RESTART_N;"
        APP: "&APP;"
        ATM_IO_LAYOUT_X: "&ATM_IO_LAYOUT_X;"
        ATM_IO_LAYOUT_Y: "&ATM_IO_LAYOUT_Y;"
        ATM_LAYOUT_X: "&ATM_LAYOUT_X;"
        ATM_LAYOUT_Y: "&ATM_LAYOUT_Y;"
        atm_model: "&atm_model;"
        CCPP_SUITE: "&CCPP_SUITE;"
        COLDSTART: "&COLDSTART;"
        COMINgdas: "&COMINgdas;"
        COMROOT: "&COMROOT;"
        CUSTOM_JEDI_CONFIG_FLAG: "&CUSTOM_JEDI_CONFIG_FLAG;"
        cyc: "&cyc;"
        DATAROOT: "&DATAROOT;"
        DATE_FIRST_CYCLE: "&DATE_FIRST_CYCLE;"
        DATE_LAST_CYCLE: "&DATE_LAST_CYCLE;"
        DATE_CYCLE_FREQ_HR: "&DATE_CYCLE_FREQ_HR;"
        DATM_DATA_TYPE: "&DATM_DATA_TYPE;"
        datm_nx_global: "&datm_nx_global;"
        datm_ny_global: "&datm_ny_global;"
        DCOMINghcn: "&DCOMINghcn;"
        DCOMINsmap: "&DCOMINsmap;"
        DCOMINsmops: "&DCOMINsmops;"
        DO_FREE_FORECAST: "&DO_FREE_FORECAST;"
        DT_ATMOS: "&DT_ATMOS;"
        DT_MOM6: "&DT_MOM6;"
        DT_RUNSEQ: "&DT_RUNSEQ;"
        FCST_HRS: "&FCST_HRS;"
        FHROT: "&FHROT;"
        FRAC_GRID: "&FRAC_GRID;"
        HOMEufsda: "&HOMEufsda;"
        IC_DATA_MODEL: "&IC_DATA_MODEL;"
        IC_FROM_FIX_DIR: "&IC_FROM_FIX_DIR;"
        ice_model: "&ice_model;"
        JEDI_ALGORITHM: "&JEDI_ALGORITHM;"
        JEDI_BIN_PATH: "&JEDI_BIN_PATH;"
        JEDI_IODACONV_PATH: "&JEDI_IODACONV_PATH;"
        JEDI_TYPE_SOCA: "&JEDI_TYPE_SOCA;"
        KEEPDATA: "&KEEPDATA;"
        list_jedi_land: "&list_jedi_land;"
        LOGDIR: "&LOGDIR;"
        MACHINE: "&MACHINE;"
        model_ver: "&model_ver;"
        MOM6_DT_THERM: "&MOM6_DT_THERM;"
        MOM6_NIGLOBAL: "&MOM6_NIGLOBAL;"
        MOM6_NJGLOBAL: "&MOM6_NJGLOBAL;"
        MOM6_NK: "&MOM6_NK;"
        NET: "&NET;"
        NPROCS_ICE: "&NPROCS_ICE;"
        NPROCS_OCN: "&NPROCS_OCN;"
        NPROCS_WAV: "&NPROCS_WAV;"
        NPZ: "&NPZ;"
        nprocs_forecast: "&nprocs_forecast;"
        nprocs_forecast_atm: "&nprocs_forecast_atm;"
        nprocs_forecast_med: "&nprocs_forecast_med;"
        OBS_GHCN_SNOW: "&OBS_GHCN_SNOW;"
        OBS_IMS_SNOW: "&OBS_IMS_SNOW;"
        OBS_SFCSNO: "&OBS_SFCSNO;"
        OBS_SMAP: "&OBS_SMAP;"
        OBS_SMOPS: "&OBS_SMOPS;"
        OCN_MESH_FN: "&OCN_MESH_FN;"
        ocn_model: "&ocn_model;"
        OUTPUT_FH: "&OUTPUT_FH;"
        OUTPUT_FH_CICE: "&OUTPUT_FH_CICE;"
        OUTPUT_FH_MOM6: "&OUTPUT_FH_MOM6;"
        OUTPUT_FH_WW3: "&OUTPUT_FH_WW3;"
        PDY: "&PDY;"
        PY_LOG_LEVEL: "&PY_LOG_LEVEL;"
        RES: "&RES;"
        RESTART_INTERVAL: "&RESTART_INTERVAL;"
        res_p1: "&res_p1;"
        SCHED: "&SCHED;"
        SMAP_RAW_WINDOW_SPAN_HALF: "&SMAP_RAW_WINDOW_SPAN_HALF;"
        WARMSTART_DIR: "&WARMSTART_DIR;"
        wav_model: "&wav_model;"
        WRITE_GROUPS: "&WRITE_GROUPS;"
        WRITE_TASKS_PER_GROUP: "&WRITE_TASKS_PER_GROUP;"
      account: "&ACCOUNT;"
      command: '&HOMEufsda;/parm/rocoto_load_modules_run_task.sh "prep_data" "&HOMEufsda;" "&MACHINE;"'
      jobname: prep_data
      nodes: "1:ppn=1"
      walltime: 00:30:00
{%- if native_default is not none %}
      native: "&native_default;"
{%- endif %}
      partition: "&partition_default;"
      queue: "&queue_default;"
      join: "&LOGDIR;/prep_data&LOGFN_SUFFIX;"
{%- if memory_flag %}
      memory: 128G
{%- endif %}
{%- if OBS_IMS_SNOW == "YES" %}
      dependency:
        or:
          datadep_sfc1:
            attrs:
              age: 5
            value: "&DATADEP_SFC1;"
          datadep_sfc2:
            attrs:
              age: 5
            value: "&DATADEP_SFC2;"
{%- endif %}
{%- endif %}
{%- if (date_second_cycle is not none and DO_FREE_FORECAST != "all") or (date_second_cycle is none and DO_FREE_FORECAST == "none" ) or DO_FREE_FORECAST == "ctest" %}
    task_analysis:
      attrs:
{%- if COLDSTART == "YES" %}
        cycledefs: cycled_from_second
{%- else %}
        cycledefs: cycled
{%- endif %}
        maxtries: 2
      envars:
        ACCOUNT: "&ACCOUNT;"
        COMINgfs: "&COMINgfs;"
        COMROOT: "&COMROOT;"
        CUSTOM_JEDI_CONFIG_FLAG: "&CUSTOM_JEDI_CONFIG_FLAG;"
        CUSTOM_JEDI_CONFIG_PATH: "&CUSTOM_JEDI_CONFIG_PATH;"
        CUSTOM_JEDI_CONFIG_PREFIX: "&CUSTOM_JEDI_CONFIG_PREFIX;"
        cyc: "&cyc;"
        DATAROOT: "&DATAROOT;"
        DATE_CYCLE_FREQ_HR: "&DATE_CYCLE_FREQ_HR;"
        DATE_FIRST_CYCLE: "&DATE_FIRST_CYCLE;"
        DO_FREE_FORECAST: "&DO_FREE_FORECAST;"
        exp_case_path: "&exp_case_path;"
        FRAC_GRID: "&FRAC_GRID;"
        HOMEufsda: "&HOMEufsda;"
        JEDI_ALGORITHM: "&JEDI_ALGORITHM;"
        JEDI_BIN_PATH: "&JEDI_BIN_PATH;"
        JEDI_TYPE_SNOW: "&JEDI_TYPE_SNOW;"
        JEDI_TYPE_SOCA: "&JEDI_TYPE_SOCA;"
        JEDI_TYPE_SOIL_MOISTURE: "&JEDI_TYPE_SOIL_MOISTURE;"
        KEEPDATA: "&KEEPDATA;"
        list_jedi_land: "&list_jedi_land;"
        LOGDIR: "&LOGDIR;"
        MACHINE: "&MACHINE;"
        model_ver: "&model_ver;"
        NPROCS_ANALYSIS: "&NPROCS_ANALYSIS;"
        NPZ: "&NPZ;"
        OBS_GHCN_SNOW: "&OBS_GHCN_SNOW;"
        OBS_IMS_SNOW: "&OBS_IMS_SNOW;"
        OBS_SFCSNO: "&OBS_SFCSNO;"
        OBS_SMAP: "&OBS_SMAP;"
        OBS_SMOPS: "&OBS_SMOPS;"
        PDY: "&PDY;"
        PY_LOG_LEVEL: "&PY_LOG_LEVEL;"
        RES: "&RES;"
        res_p1: "&res_p1;"
        SCHED: "&SCHED;"
        WARMSTART_DIR: "&WARMSTART_DIR;"
      account: "&ACCOUNT;"
      command: '&HOMEufsda;/parm/rocoto_load_modules_run_task.sh "analysis" "&HOMEufsda;" "&MACHINE;"'
      jobname: analysis
      nodes: "1:ppn=&NPROCS_ANALYSIS;"
{%- if native_default is not none %}
      native: "&native_default;"
{%- endif %}
      walltime: 00:15:00
      partition: "&partition_default;"
      queue: "&queue_default;"
      join: "&LOGDIR;/analysis&LOGFN_SUFFIX;"
{%- if MACHINE == "ursa" %}
      memory: 32G
{%- endif %}
{%- if DO_FREE_FORECAST != "ctest" %}
      dependency:
        and:
          taskdep_prep_data:
            attrs:
              task: prep_data
          or:
            datadep_sfc1:
              attrs:
                age: 5
              value: "&DATADEP_SFC1;"
            datadep_sfc2:
              attrs:
                age: 5
              value: "&DATADEP_SFC2;"
{%- endif %}
{%- endif %}
{%- if COLDSTART == "YES" and IC_FROM_FIX_DIR == "NO" %}
    task_fcst_ic:
      attrs:
        cycledefs: first_cycle
        maxtries: 2
      envars:
        ACCOUNT: "&ACCOUNT;"
        APP: "&APP;"
        COMINgdas: "&COMINgdas;"
        COMINgfs: "&COMINgfs;"
        COMROOT: "&COMROOT;"
        cyc: "&cyc;"
        DATAROOT: "&DATAROOT;"
        HOMEufsda: "&HOMEufsda;"
        IC_DATA_MODEL: "&IC_DATA_MODEL;"
        KEEPDATA: "&KEEPDATA;"
        MACHINE: "&MACHINE;"
        model_ver: "&model_ver;"
        NPROCS_FCST_IC: "&NPROCS_FCST_IC;"
        PDY: "&PDY;"
        RES: "&RES;"
        SCHED: "&SCHED;"
      account: "&ACCOUNT;"
      command: '&HOMEufsda;/parm/rocoto_load_modules_run_task.sh "fcst_ic" "&HOMEufsda;" "&MACHINE;"'
      jobname: fcst_ic
      nodes: "1:ppn=&NPROCS_FCST_IC;"
      walltime: 00:15:00
{%- if native_default is not none %}
      native: "&native_default;"
{%- endif %}
      partition: "&partition_default;"
      queue: "&queue_default;"
      join: "&LOGDIR;/fcst_ic&LOGFN_SUFFIX;"
{%- if memory_flag %}
      memory: 128G
{%- endif %}
{%- endif %}
{%- if DO_FREE_FORECAST != "ctest" %}
    task_forecast:
      attrs:
{%- if DO_FREE_FORECAST == "first" %}
        cycledefs: first_cycle
{%- else %}
        cycledefs: cycled
{%- endif %}
        maxtries: 2
      envars:
        ACCOUNT: "&ACCOUNT;"
        APP: "&APP;"
        atm_model: "&atm_model;"
        COLDSTART: "&COLDSTART;"
        COMROOT: "&COMROOT;"
        cyc: "&cyc;"
        DATAROOT: "&DATAROOT;"
        DATE_FIRST_CYCLE: "&DATE_FIRST_CYCLE;"
        DATE_LAST_CYCLE: "&DATE_LAST_CYCLE;"
        DATE_CYCLE_FREQ_HR: "&DATE_CYCLE_FREQ_HR;"
        DATM_DATA_TYPE: "&DATM_DATA_TYPE;"
        datm_nx_global: "&datm_nx_global;"
        datm_ny_global: "&datm_ny_global;"
        DO_FREE_FORECAST: "&DO_FREE_FORECAST;"
        FCST_HRS: "&FCST_HRS;"
        HOMEufsda: "&HOMEufsda;"
        IC_FROM_FIX_DIR: "&IC_FROM_FIX_DIR;"
        ice_model: "&ice_model;"
        KEEPDATA: "&KEEPDATA;"
        LOGDIR: "&LOGDIR;"
        MACHINE: "&MACHINE;"
        model_ver: "&model_ver;"
        NET: "&NET;"
        NPZ: "&NPZ;"
        nprocs_forecast: "&nprocs_forecast;"
        OCN_MESH_FN: "&OCN_MESH_FN;"
        ocn_model: "&ocn_model;"
        OUTPUT_FH: "&OUTPUT_FH;"
        OUTPUT_FH_CICE: "&OUTPUT_FH_CICE;"
        OUTPUT_FH_MOM6: "&OUTPUT_FH_MOM6;"
        OUTPUT_FH_WW3: "&OUTPUT_FH_WW3;"
        PDY: "&PDY;"
        PY_LOG_LEVEL: "&PY_LOG_LEVEL;"
        RES: "&RES;"
        res_p1: "&res_p1;"
        SCHED: "&SCHED;"
        WARMSTART_DIR: "&WARMSTART_DIR;"
        wav_model: "&wav_model;"
      account: "&ACCOUNT;"
      command: '&HOMEufsda;/parm/rocoto_load_modules_run_task.sh "forecast" "&HOMEufsda;" "&MACHINE;"'
      jobname: forecast
      nodes: "&nnodes_forecast;:ppn=&nprocs_per_node;"
      walltime: {{ WALLTIME_FORECAST }}
{%- if native_default is not none %}
      native: "&native_default;"
{%- endif %}
      partition: "&partition_default;"
      queue: "&queue_default;"
      join: "&LOGDIR;/forecast&LOGFN_SUFFIX;"
      dependency:
        and:
          taskdep_prep_data:
            attrs:
              task: prep_data
          or:
{%- if IC_FROM_FIX_DIR == "YES" %}
            datadep_coldstart:
              attrs:
                age: 5
              value: "&DATADEP_COLDSTART;"
{%- else %}
            taskdep_fcst_ic:
              attrs:
                task: fcst_ic
{%- endif %}
{%- if DO_FREE_FORECAST == "none" %}
            taskdep_analysis:
              attrs:
                task: analysis
{%- else %}
{%- if APP == "S2SWA" %}
            datadep_sfc1:
              attrs:
                age: 5
              value: "&DATADEP_SFC1;"
            datadep_sfc2:
              attrs:
                age: 5
              value: "&DATADEP_SFC2;"
{%- elif APP == "NG-GODAS" %}
            datadep_mom1:
              attrs:
                age: 5
              value: "&DATADEP_MOM1;"
            datadep_mom2:
              attrs:
                age: 5
              value: "&DATADEP_MOM2;"
{%- endif %}
{%- endif %}
{%- endif %}
    task_plot_stats:
      attrs:
        cycledefs: cycled
        maxtries: 2
      envars:
        ACCOUNT: "&ACCOUNT;"
        APP: "&APP;"
        COLDSTART: "&COLDSTART;"
        COMROOT: "&COMROOT;"
        cyc: "&cyc;"
        DATAROOT: "&DATAROOT;"
        DATE_CYCLE_FREQ_HR: "&DATE_CYCLE_FREQ_HR;"
        DATE_FIRST_CYCLE: "&DATE_FIRST_CYCLE;"
        DATE_LAST_CYCLE: "&DATE_LAST_CYCLE;"
        DO_FREE_FORECAST: "&DO_FREE_FORECAST;"
        FCST_HRS: "&FCST_HRS;"
        FRAC_GRID: "&FRAC_GRID;"
        HOMEufsda: "&HOMEufsda;"
        JEDI_ALGORITHM: "&JEDI_ALGORITHM;"
        JEDI_TYPE_SOCA: "&JEDI_TYPE_SOCA;"
        KEEPDATA: "&KEEPDATA;"
        LOGDIR: "&LOGDIR;"
        MACHINE: "&MACHINE;"
        model_ver: "&model_ver;"
        NET: "&NET;"
        OBS_GHCN_SNOW: "&OBS_GHCN_SNOW;"
        OBS_IMS_SNOW: "&OBS_IMS_SNOW;"
        OBS_SFCSNO: "&OBS_SFCSNO;"
        OBS_SMAP: "&OBS_SMAP;"
        OBS_SMOPS: "&OBS_SMOPS;"
        OUTPUT_FH: "&OUTPUT_FH;"
        OUTPUT_FH_CICE: "&OUTPUT_FH_CICE;"
        OUTPUT_FH_MOM6: "&OUTPUT_FH_MOM6;"
        OUTPUT_FH_WW3: "&OUTPUT_FH_WW3;"
        PDY: "&PDY;"
        PY_LOG_LEVEL: "&PY_LOG_LEVEL;"
        RES: "&RES;"
        SCHED: "&SCHED;"
      account: "&ACCOUNT;"
      command: '&HOMEufsda;/parm/rocoto_load_modules_run_task.sh "plot_stats" "&HOMEufsda;" "&MACHINE;"'
      jobname: plot_stats
      cores: 1
      walltime: 00:10:00
{%- if native_default is not none %}
      native: "&native_default;"
{%- endif %}
      partition: "&partition_default;"
      queue: "&queue_default;"
      join: "&LOGDIR;/plot_stats&LOGFN_SUFFIX;"
      dependency:
{%- if ( COLDSTART == "YES" and date_second_cycle is none ) or DO_FREE_FORECAST == "none" %}
        taskdep_forecast:
          attrs:
            task: forecast
{%- else %}
        or:
          taskdep_analysis:
            attrs:
              task: analysis
          taskdep_forecast:
            attrs:
              task: forecast
{%- endif %}
