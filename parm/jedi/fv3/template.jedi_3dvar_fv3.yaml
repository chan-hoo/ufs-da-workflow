  observations:
    obs perturbations: false
    observers:
{%- if OBS_ATM_CONVENTIONAL_PS == "YES" %}
    - obs space:
        name: conventional_ps
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/obs.{{ PDY }}.{{ cycle }}.conventional_ps.nc
            missing file action: warn
        obsdataout:
          engine:
            type: H5File
            obsfile: ./diags/diag.conventional_ps_{{ cdate }}.nc
        io pool:
          max pool size: 1
        simulated variables:
        - stationPressure
      obs operator:
        name: SfcCorrected
        variables:
        - name: stationPressure
        correction scheme to use: GSL
        station_altitude: height
        geovar_sfc_geomz: height_above_mean_sea_level_at_surface
        geovar_geomz: geopotential_height
      linear obs operator:
        name: Identity
        variables:
        - name: stationPressure
      obs prior filters:
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 181
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              round_to_the_nearest_integer: true
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 80000
              - 75000
              - 70000
              - 65000
              - 60000
              - 55000
              errors:
              - 110
              - 120
              - 120
              - 120
              - 120
              - 100000000000.0
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 187
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              round_to_the_nearest_integer: true
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 85000
              - 80000
              - 75000
              - 70000
              - 65000
              - 60000
              - 55000
              errors:
              - 120
              - 140
              - 140
              - 140
              - 140
              - 140
              - 100000000000.0
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 180
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              round_to_the_nearest_integer: true
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 60000
              - 55000
              errors:
              - 130
              - 100000000000.0
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 183
        action:
          name: assign error
          error parameter: 100000000000.0
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: ObsType/stationPressure
          is_in:
          - 120
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              round_to_the_nearest_integer: true
              xvar:
                name: ObsValue/stationPressure
              xvals:
              - 80000
              - 75000
              - 70000
              - 65000
              - 60000
              - 55000
              errors:
              - 110
              - 120
              - 120
              - 120
              - 120
              - 100000000000.0
      - filter: Variable Assignment
        assignments:
        - name: InputObsError/stationPressure
          type: float
          source variable: ObsErrorData/stationPressure
      - filter: Variable Assignment
        assignments:
        - name: PreQC/stationPressure
          type: int
          source variable: QualityMarker/stationPressure
      - filter: Variable Assignment
        assignments:
        - name: PreUseFlag/stationPressure
          type: int
          source variable: PreQC/stationPressure
      - filter: Variable Assignment
        where:
        - variable:
            name: PreUseFlag/stationPressure
          is_in: 1-15
        assignments:
        - name: PreUseFlag/stationPressure
          value: 0
      - filter: Variable Assignment
        where:
        - variable:
            name: ObsType/stationPressure
          is_in: 183
        assignments:
        - name: PreUseFlag/stationPressure
          value: 100
      - filter: Variable Assignment
        where:
        - variable:
            name: ObsValue/stationPressure
          is_defined: null
        - variable:
            name: ObsValue/stationPressure
          maxvalue: 50000.0
        where operator: and
        assignments:
        - name: PreUseFlag/stationPressure
          value: 100
      - filter: Variable Assignment
        where:
        - variable:
            name: PreQC/stationPressure
          is_in: 9, 12, 15
        assignments:
        - name: PreUseFlag/stationPressure
          value: 100
      - filter: Variable Assignment
        where:
        - variable:
            name: PreQC/stationPressure
          is_in: 4-15
        assignments:
        - name: PreUseFlag/stationPressure
          value: 101
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: PreQC/stationPressure
          is_in: 3, 7
        action:
          name: inflate error
          inflation factor: 1.2
      obs post filters:
      - filter: Variable Assignment
        assignments:
        - name: ObsErrorFactorDuplicateCheck/stationPressure
          type: float
          function:
            name: ObsFunction/ObsErrorFactorDuplicateCheck
            options:
              use_air_pressure: false
              variable: stationPressure
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable:
            name: ObsType/stationPressure
          is_in: 180
        - variable:
            name: ObsSubType/stationPressure
          is_in: 0
        action:
          name: inflate error
          inflation factor: 0.7
      - filter: Variable Assignment
        assignments:
        - name: ObsErrorFactorSfcPressure/stationPressure
          type: float
          function:
            name: ObsFunction/ObsErrorFactorSfcPressure
            options:
              geovar_sfc_geomz: height_above_mean_sea_level_at_surface
              geovar_geomz: geopotential_height
              station_altitude: height
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        action:
          name: inflate error
          inflation variable:
            name: ObsErrorFactorSfcPressure/stationPressure
      - filter: Variable Assignment
        assignments:
        - name: DerivedMetaData/Innovation
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: ObsValue/stationPressure
              - name: HofX/stationPressure
              coefs:
              - 1
              - -1
      - filter: Variable Assignment
        assignments:
        - name: DerivedMetaData/ObsErrorBoundSfcPressure1
          type: float
          function:
            name: ObsFunction/ObsErrorBoundConventional
            options:
              obsvar: stationPressure
              obserr_bound_min: 100
              obserr_bound_max: 300
              obserr_bound_factor: 5.0
      - filter: Background Check
        filter variables:
        - name: stationPressure
        where:
        - variable: PreQC/stationPressure
          is_not_in: 3
        function absolute threshold:
        - name: DerivedMetaData/ObsErrorBoundSfcPressure1
        action:
          name: reject
      - filter: Variable Assignment
        assignments:
        - name: DerivedMetaData/ObsErrorBoundSfcPressure2
          type: float
          function:
            name: ObsFunction/ObsErrorBoundConventional
            options:
              obsvar: stationPressure
              obserr_bound_min: 100
              obserr_bound_max: 300
              obserr_bound_factor: 3.5
      - filter: Background Check
        filter variables:
        - name: stationPressure
        where:
        - variable: PreQC/stationPressure
          is_in: 3
        function absolute threshold:
        - name: DerivedMetaData/ObsErrorBoundSfcPressure2
        action:
          name: reject
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        action:
          name: inflate error
          inflation variable:
            name: ObsErrorFactorDuplicateCheck/stationPressure
      - filter: Perform Action
        filter variables:
        - name: stationPressure
        where:
        - variable: PreUseFlag/stationPressure
          is_not_in: 0, 1
        action:
          name: reject
{%- endif %}
{%- if OBS_ATM_GNSSRO_COSMIC2 == "YES" %}
    - obs space:
        name: gnssro_cosmic2
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/obs.{{ PDY }}.{{ cycle }}.gnssro_cosmic2.nc
            missing file action: warn
          obsgrouping:
            group variables:
            - sequenceNumber
            sort variable: impactHeightRO
            sort order: ascending
        obsdataout:
          engine:
            type: H5File
            obsfile: ./diags/diag.gnssro_cosmic2_{{ cdate }}.nc
        simulated variables:
        - bendingAngle
      obs operator:
        name: GnssroBndNBAM
        obs options:
          use_compress: 1
          sr_steps: 2
          vertlayer: full
          super_ref_qc: NBAM
          output_diags: true
      obs filters:
      - filter: Create Diagnostic Flags
        filter variables:
        - name: bendingAngle
        flags:
        - name: pccfCheckReject
          initial value: false
          force reinitialization: true
      - filter: Bounds Check
        filter variables:
        - name: bendingAngle
        where:
        - variable:
            name: MetaData/satelliteIdentifier
          is_in: 265-269,750-755,44,786,820,825
        test variables:
        - name: MetaData/pccf
        minvalue: 0.1
        maxvalue: 100.1
        actions:
        - name: set
          flag: pccfCheckReject
        - name: reject
      - filter: Domain Check
        filter variables:
        - name: bendingAngle
        where:
        - variable:
            name: MetaData/impactHeightRO
          minvalue: 0
          maxvalue: 55000.1
        action:
          name: reject
      - filter: Background Check RONBAM
        filter variables:
        - name: bendingAngle
        action:
          name: reject
        defer to post: true
      - filter: ROobserror
        filter variables:
        - name: bendingAngle
        errmodel: NBAM
        defer to post: true
      - filter: Perform Action
        filter variables:
        - name: bendingAngle
        action:
          name: RONBAMErrInflate
        defer to post: true
{%- endif %}
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 2
    gradient norm reduction: 1e-10
    test: true
    geometry:
      fms initialization:
        namelist filename: ./fv3jedi/fmsmpp.nml
        field table filename: ./fv3jedi/field_table
      akbk: ./fv3jedi/akbk.nc4
      layout:
      - {{ fv3_geo_layout_x }}
      - {{ fv3_geo_layout_y }}
      npx: {{ fv3_variational_geo_npx }}
      npy: {{ fv3_variational_geo_npy }}
      npz: {{ fv3_variational_geo_npz }}
      vert coordinate: logp
    diagnostics:
      departures: bkgmob
  - ninner: 4
    gradient norm reduction: 1e-10
    test: true
    geometry:
      fms initialization:
        namelist filename: ./fv3jedi/fmsmpp.nml
        field table filename: ./fv3jedi/field_table
      akbk: ./fv3jedi/akbk.nc4
      layout:
      - {{ fv3_geo_layout_x }}
      - {{ fv3_geo_layout_y }}
      npx: {{ fv3_variational_geo_npx }}
      npy: {{ fv3_variational_geo_npy }}
      npz: {{ fv3_variational_geo_npz }}
      vert coordinate: logp
    diagnostics:
      departures: bkgmob1
final:
  diagnostics:
    departures: anlmob
  prints:
    frequency: {{ fv3_final_print_freq }}
  increment:
    output:
      state component:
        filetype: cube sphere history
        filename: ./anl/cubed_sphere_grid_atminc.jedi.nc
        provider: ufs
        fields to write:
        - eastward_wind
        - northward_wind
        - air_temperature
        - air_pressure_at_surface
        - water_vapor_mixing_ratio_wrt_moist_air
        - cloud_liquid_ice
        - cloud_liquid_water
        - snow_water
        - rain_water
        - graupel
        - ozone_mass_mixing_ratio
        field io names:
          eastward_wind: ugrd
          northward_wind: vgrd
          air_temperature: tmp
          air_pressure_at_surface: pressfc
          water_vapor_mixing_ratio_wrt_moist_air: spfh
          cloud_liquid_ice: icmr
          cloud_liquid_water: clwmr
          snow_water: snmr
          rain_water: rwmr
          graupel: grle
          ozone_mass_mixing_ratio: o3mr
    geometry:
      fms initialization:
        namelist filename: ./fv3jedi/fmsmpp.nml
        field table filename: ./fv3jedi/field_table
      akbk: ./fv3jedi/akbk.nc4
      layout:
      - {{ fv3_geo_layout_x }}
      - {{ fv3_geo_layout_y }}
      npx: {{ fv3_geo_npx }}
      npy: {{ fv3_geo_npy }}
      npz: {{ fv3_geo_npz }}
final j evaluation: false
